<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Санал хүсэлт — Админ</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #eef1f4;
        --border: #dde1e6;
        --text: #171a1f;
        --text-secondary: #565d68;
        --accent: #2f7cd6;
        --accent-text: #1d5fae;
        --danger-bg: #fbeeee;
        --danger-border: #e3b9b9;
        --danger-text: #a13a3a;
        --chip-bg: #f5f9ff;
        --chip-border: #cfe0f5;
        --radius-sm: 8px;
        --radius-md: 12px;
        --font-sans: "Inter", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        /* Three-step scale, each step ≥1.25x the last, so headings, body
           content, and metadata stay visually distinct at a glance. */
        --fs-lg: 1.5rem;
        --fs-body: 1rem;
        --fs-small: 0.75rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--fs-body);
        line-height: 1.5;
      }

      .page {
        max-width: 860px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: var(--fs-lg);
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--text-secondary);
        font-size: var(--fs-small);
      }

      .state {
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text-secondary);
        text-align: center;
      }

      .state--error {
        background: var(--danger-bg);
        border-color: var(--danger-border);
        color: var(--danger-text);
      }

      .doc-card {
        margin-bottom: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        overflow: hidden;
      }

      .doc-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        cursor: pointer;
      }

      .doc-card__title {
        min-width: 0;
        font-weight: 600;
        font-size: var(--fs-body);
        word-break: break-word;
      }

      .doc-card__count {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 14px;
        background: var(--danger-bg);
        color: var(--danger-text);
        font-weight: 600;
        font-size: var(--fs-small);
        white-space: nowrap;
      }

      .doc-card__reasons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 18px 14px;
      }

      .reason-chip {
        padding: 3px 9px;
        border-radius: 12px;
        background: var(--chip-bg);
        border: 1px solid var(--chip-border);
        color: var(--accent-text);
        font-size: var(--fs-small);
      }

      .doc-card__examples {
        display: none;
        border-top: 1px solid var(--border);
        padding: 12px 18px 16px;
        background: var(--surface-2);
      }

      .doc-card--open .doc-card__examples {
        display: block;
      }

      .example {
        padding: 8px 0;
        border-bottom: 1px dashed var(--border);
      }

      .example:last-child {
        border-bottom: none;
      }

      .example__question {
        margin: 0 0 3px;
        color: var(--text);
        font-size: var(--fs-body);
      }

      .example__meta {
        margin: 0;
        color: var(--text-secondary);
        font-size: var(--fs-small);
      }

      .refresh {
        margin-bottom: 20px;
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: var(--fs-small);
        cursor: pointer;
      }

      .refresh:hover {
        background: var(--surface-2);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>👎 Санал хүсэлт — баримт бичгээр</h1>
      <p class="subtitle">
        Хамгийн муу гүйцэтгэлтэй бодлогууд эхэнд жагсаана. Дэлгэрэнгүйг харахын тулд мөрөн дээр дарна уу.
      </p>
      <button class="refresh" onclick="load()">↻ Шинэчлэх</button>
      <div id="content"><div class="state">Ачааллаж байна...</div></div>
    </div>

    <script>
      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
      }

      function renderExamples(examples) {
        if (!examples.length) return "<p class=\"example__meta\">Жишээ алга.</p>";
        return examples
          .map((ex) => {
            const when = new Date(ex.receivedAt).toLocaleString("mn-MN");
            const reasonLabel = ex.reason ? escapeHtml(ex.reason) : "(шалтгаан заагаагүй)";
            const note = ex.reasonText ? ` — ${escapeHtml(ex.reasonText)}` : "";
            return `
              <div class="example">
                <p class="example__question">${escapeHtml(ex.question)}</p>
                <p class="example__meta">${when} · ${reasonLabel}${note}</p>
              </div>
            `;
          })
          .join("");
      }

      function renderDoc(doc) {
        const reasonChips = Object.entries(doc.reasons)
          .sort((a, b) => b[1] - a[1])
          .map(([reason, count]) => `<span class="reason-chip">${escapeHtml(reason)} · ${count}</span>`)
          .join("");

        return `
          <div class="doc-card">
            <div class="doc-card__header" onclick="this.parentElement.classList.toggle('doc-card--open')">
              <span class="doc-card__title">${escapeHtml(doc.document)}</span>
              <span class="doc-card__count">👎 ${doc.downCount}</span>
            </div>
            ${reasonChips ? `<div class="doc-card__reasons">${reasonChips}</div>` : ""}
            <div class="doc-card__examples">${renderExamples(doc.recentExamples)}</div>
          </div>
        `;
      }

      async function load() {
        const content = document.getElementById("content");
        content.innerHTML = '<div class="state">Ачааллаж байна...</div>';
        try {
          const response = await fetch("/api/feedback/negative-summary");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const body = await response.json();
          if (!body.documents.length) {
            content.innerHTML = '<div class="state">👎 санал хүсэлт алга байна.</div>';
            return;
          }
          content.innerHTML = body.documents.map(renderDoc).join("");
        } catch (err) {
          content.innerHTML = `<div class="state state--error">Ачаалахад алдаа гарлаа: ${escapeHtml(
            err.message,
          )}</div>`;
        }
      }

      load();
    </script>
  </body>
</html>
