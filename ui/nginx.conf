server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to our backend so the browser only ever talks to this
    # origin — never the raw Anthropic/Ollama API (docs/ARCHITECTURE.md).
    location /v1/ {
        proxy_pass http://app:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
