# Eval set for app/eval — Mongolian Q&A pairs (see docs/EVAL_RUNBOOK.md).
#
# expected_source_file must match policy_chunks.file_name EXACTLY (the bare
# name stored at ingest, no version/date suffix; see docs/DATA_CONTRACT.md).
# null for should_refuse: true cases, since no citation is expected.
#
# Grounded against the 22 ISO-27001 documents in ./policies/ as of 2026-08-10,
# authored from facts read out of live policy_chunks rows — not guessed. The
# earlier HR documents (work hours / leave / internal labour rules) were sample
# data and have been removed from the corpus; questions about them now appear
# below as REFUSAL cases, which is exactly what they should be.
#
# Three kinds of case, on purpose:
#   - answerable      : a specific fact that exists in exactly one document
#   - must-refuse     : not in the corpus at all (off-topic, or removed HR docs)
#   - wrong-doc traps : security vocabulary that overlaps several policies, to
#                       catch the failure mode where a plausible-but-wrong
#                       document outranks the right one

