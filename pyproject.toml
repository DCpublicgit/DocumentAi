[project]
name = "policy-chatbot"
version = "0.1.0"
description = "Retrieval-grounded internal policy chatbot (Mongolian)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "torch>=2.4,<2.10",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# BGE-M3 runs on CPU only (docs/ARCHITECTURE.md); plain PyPI `torch` pulls
# the CUDA build plus ~2.5GB of unused nvidia-* packages, so pin it to
# PyTorch's CPU-only wheel index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
